name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  demoshark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          sudo apt-get install -y fonts-noto-core || true
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Check the spec (rules DS1-DS10)
        run: python -m demoshark check specs/paydesk-approve-invoice.yaml
      - name: Tests
        run: python -m pytest -q
      - name: Record the sample, captions only (en, th)
        run: python -m demoshark demo --voice none --lang en,th
      - name: Drift must fail
        run: |
          if python -m demoshark demo --drift --voice none --lang en; then
            echo "A renamed button was not detected"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough
          path: build/paydesk-approve-invoice/
