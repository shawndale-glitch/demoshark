[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demoshark"
version = "0.1.0"
description = "Spec in; narrated walk-through video, PowerPoint deck and guide out, in every language, checked step by step."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shawn Dale" }]
dependencies = [
  "playwright>=1.45,<2",
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "imageio-ffmpeg>=0.5",
  "python-pptx>=1.0",
  "edge-tts>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
demoshark = "demoshark.cli:main"

[tool.setuptools]
packages = ["demoshark", "demoshark.adapters", "demoshark.demoapp"]

[tool.setuptools.package-data]
demoshark = ["schema/*.json"]
"demoshark.demoapp" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
